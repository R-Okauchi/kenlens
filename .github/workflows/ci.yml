name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Test
        run: pnpm -F @kenlens/extension test
      - name: Build (Chrome MV3)
        run: pnpm -F @kenlens/extension build
      - name: Build (Firefox MV3)
        run: pnpm -F @kenlens/extension build:firefox
      - name: Build site
        run: pnpm -F @kenlens/site build
