<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="KenLens">
  <defs>
    <linearGradient id="kenlens-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D9488"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>
  <!-- squircle: rx ~22% of 128 -->
  <rect width="128" height="128" rx="28" fill="url(#kenlens-g)"/>
  <!-- magnifier lens -->
  <circle cx="56" cy="56" r="26" fill="none" stroke="#FFFFFF" stroke-width="9"/>
  <!-- magnifier handle -->
  <line x1="76" y1="76" x2="98" y2="98" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round"/>
  <!-- quote-lines inside the lens -->
  <line x1="46" y1="49" x2="67" y2="49" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <line x1="46" y1="63" x2="60" y2="63" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
</svg>
